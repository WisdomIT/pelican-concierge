  # ────────────────────────────────────────────────────────────────
  - id: rust
    name: 러스트
    summary: 하드코어 생존·PvP. 맵 생성에 시간이 걸린다.
    egg: Rust
    player_var: null
    sizes:
      - { id: m, label: "20명 정도", players: 20, memory: 8192,  disk: 20480, cpu: 300 }
      - { id: l, label: "50명 정도", players: 50, memory: 12288, disk: 30720, cpu: 400 }
    ask:
      - { env: RCON_PASS, label: 관리자(RCON) 비밀번호, type: password }   # 필수·기본값 없음
      # uMod 플러그인 탭(Rust uMod)은 FRAMEWORK 가 oxide 일 때만 뜬다. 순정과 달리 서버에
      # 모드 프레임워크가 깔리므로 사용자가 고르게 한다. 기본은 oxide — 플러그인을 쓰라고 여는 것이다.
      - env: FRAMEWORK
        label: 플러그인 지원 (uMod)
        type: choice
        choices: ["oxide", "vanilla"]
        default: "oxide"
    defaults: {}
    # ⚠ RCON 이 별도 포트(28016)를 바인드한다 — 실측 확인.
    #   외부에서 RCON 을 쓰려면 별도 할당이 필요하다. 게임 접속만이면 1개로 충분.
    # 🔴 두 번째 포트는 **쿼리 포트**다(#18 실측). Rust 는 `+server.queryport {{QUERY_PORT}}` 를
    #   쓰는데 egg 기본값(27017)은 publish 되지 않아 게임 포트 ±3 어디서도 A2S 무응답이었다.
    #   할당을 파생해 넣으니 그 포트에서 응답·파싱 정상 (0/40). 서버 브라우저 노출에도 필요하다.
    ports:
      count: 2
      protocol: [tcp, udp]
      derive:
        - { env: QUERY_PORT, from: allocation, index: 1 }
    query: source
    query_port_variable: QUERY_PORT
    secrets: [RCON_PASS]
    mods: { supported: true, kind: plugin, note: "FRAMEWORK=oxide 로 개설하면 패널의 uMod 탭에서 플러그인 검색·설치 가능 (Rust uMod 플러그인)" }
    # 설치 완료 판정 하한(MB, du -sh 기준). 실측값의 약 70%.
    #  ⚠ Pelican 은 중간에 끊긴 설치도 installed 로 표시한다 — 용량이 유일한 단서다.
    install_min_mb: 4000
    verified: { install: "5.8GB", boot: "맵 생성 진행, RCON 28016 바인드" }

  # ────────────────────────────────────────────────────────────────
  - id: ark-survival-evolved
    name: "아크: 서바이벌 이볼브드"
    summary: 공룡 생존. 설치 22GB, 첫 기동에 10분 이상 걸린다.
    egg: "Ark: Survival Evolved"
    player_var: MAX_PLAYERS
    sizes:
      - { id: m, label: "10명 정도", players: 10, memory: 14336, disk: 40960, cpu: 400 }
    ask:
      - { env: SESSION_NAME, label: 서버 이름, type: text, default: "MyArk" }
      - { env: ARK_PASSWORD, label: 접속 비밀번호, type: password, optional: true }
      - { env: ARK_ADMIN_PASSWORD, label: 관리자 비밀번호, type: password }
      - { env: SERVER_MAP, label: 맵, type: choice, choices: ["TheIsland","Ragnarok","TheCenter"], default: "TheIsland" }
    defaults:
      BATTLE_EYE: "0"        # 컨테이너에서 BattlEye 는 문제 소지 → 기본 끔
      AUTO_UPDATE: "0"
    # 🔴 포트 4개 필요 — 실측으로 확인한 리스닝 포트:
    #      SERVER_PORT / SERVER_PORT+1 / QUERY_PORT(27015) / RCON_PORT(27020)
    #    QUERY·RCON 기본값이 할당 범위 밖이라 그대로 두면 외부에서 안 붙는다.
    #    플러그인은 할당을 1개만 주므로 개설 대행 함수(#7)가 나머지를 붙여야 한다.
    ports:
      count: 4
      protocol: [tcp, udp]
      derive:
        - { env: QUERY_PORT, from: allocation, index: 2 }
        - { env: RCON_PORT,  from: allocation, index: 3 }
    # 유휴 판정용 접속자 쿼리(#18). 게임 포트가 아니라 **QUERY_PORT**(파생 할당)에서 응답 —
    # 실측 확인 (0/10 파싱). 게임 포트 ±1 은 무응답이다.
    query: source
    query_port_variable: QUERY_PORT
    secrets: [ARK_PASSWORD, ARK_ADMIN_PASSWORD]
    # ⚠ egg 는 RCON 이 붙을 때까지 "waiting for rcon connection..." 을 반복 출력한다.
    #   이건 **로딩 중 정상 출력**이다. 첫 기동 10분+ 소요.
    #   기동 확인은 로그가 아니라 RCON 을 직접 찔러본다:
    #     docker exec <uuid> rcon -t rcon -a 127.0.0.1:27020 -p <ARK_ADMIN_PASSWORD> ListPlayers
    notes:
      - "설치 22GB. 첫 시도가 294MB 에서 실패하면 재설치(간헐적 오류)"
      - "'waiting for rcon connection' 은 로딩 중 정상 — RCON 응답으로 판단할 것"
    mods: { supported: true, kind: workshop_id, note: "MOD_ID 변수에 워크숍 ID 를 넣는다" }
    # 설치 완료 판정 하한(MB, du -sh 기준). 실측값의 약 70%.
    #  ⚠ Pelican 은 중간에 끊긴 설치도 installed 로 표시한다 — 용량이 유일한 단서다.
    install_min_mb: 15000
    verified: { install: "22GB", boot: "RCON ListPlayers → No Players Connected" }

